        - Description: 'Led <strong>IAM operations for ~5,000 users</strong>, completing all aspects of <strong>Okta Identity Engine</strong> upgrade(s), achieving <strong>enhanced regulatory compliance</strong> and <strong>seamless access</strong> for employees and contractors.'
          LinkText: Okta Identity Engine
          LinkURL: 'https://andrewdoering.org/blog/2023/oie-fastpass-devicetrust-deployment/'

        - Description: 'Implemented <strong>Self-Service Processes</strong> for End Users to access Applications, Groups, and other Memberships through <strong>Entitlement Management and Identity Governance</strong> (via <strong>Lumos</strong>). Resulting in a reduction of Tech Support Tickets by 64%.'

        - Description: 'Implemented <strong>Device Assurance, Compliance, and Posturing</strong> for self-servicing issues with <strong>Kolide</strong>, enhancing <strong>security standards</strong> for external users.'
          LinkText: Example
          LinkURL: 'https://andrewdoering.org/blog/2024/kolide-local-administrators-check/'

        - Description: 'Championed <strong>CI/CD pipelines</strong> and <strong>Agile practices</strong> (via Jira) to increase team velocity and improve deployment workflows.'

        - Description: 'Reduced <strong>operational costs by $400K+</strong> using <strong>automation</strong> and <strong>tech debt cleanup</strong> initiatives.'

        - Description: 'Advised <strong>EQT Ventures</strong> on due diligence and helped portfolio teams implement secure user systems, including authentication design for ADA (IVCEvidensia) using OAuth 2.0 + OIDC.'

        - Description: 'Standardized <strong>cross-functional processes</strong> and <strong>technical implementations</strong>, including global <strong>cost center change workflows</strong> and the deployment of <strong>Managed Apple IDs</strong> via <strong>Apple Business Manager</strong>, ensuring <strong>regulatory alignment</strong>, <strong>centralized communication</strong>, and <strong>scalable SSO integration</strong> across multinational environments.'

        - Description: 'Guided <strong>enterprise app configurations</strong> (AARO, EBX, MRI, Slack Enterprise) with <strong>secure SSO</strong> and <strong>domain integrations</strong>, in addition to modern services (<strong>Slack Enterprise Grid</strong>, <strong>Google Workspace</strong>).'

        - Description: 'Mentored colleagues on tools like <strong>Workato</strong>, <strong>Jamf</strong>, and <strong>Okta</strong>, helping team members achieve <strong>technical certifications</strong> and improve skill sets (such as git, terraform, and bash scripting).'

        - Description: 'Member of the <strong>Acquisition Planning and Execution Team</strong>, contributing to <strong>seamless technology integration</strong> during transitions.'
          LinkText: Company Announcement
          LinkURL: https://web.archive.org/web/20240227212022/https://eqtgroup.com/news/2022/eqt-combines-with-bpea-to-capture-growth-opportunities-in-asia/


