languageCode = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = true

theme = "delize-cv-template"
disableKinds = ["page", "section", "taxonomy", "term", "RSS", "sitemap"]

baseURL = "https://example.com/"
title = "Example - CV"
#googleAnalytics = ""

[params]
enableMetaTags = true
colorLight = "#fff"
colorDark = "#666"
colorPageBackground = "#ccc"
colorPrimary = "#58595b"
colorSecondary = "#f68d2e"

# Text color options
colorBodyText = "#555"
colorListText = "#444"
colorHeadingText = "#f68d2e"
colorIconPrimary = "#000"
colorIconBackground = "#eceef1"
colorRightColumnBackground = "#f5f5f5"
colorRightColumnHeadingText = "#666"
colorRightColumnBodyText = "#666"
colorRightColumnIconPrimary = "#fff"
colorRightColumnIconBackground = "#e3bfb8"
pages = 2
# Set this param to 'true' to swap the bar positions
swapColumns = true
footerNote = "2020 © by Inês Almeida   |   ines-almeida.com"

# Enhanced Features Configuration
# Enable contact obfuscation for email and phone security
enableContactObfuscation = true
# Enable structured data (Schema.org JSON-LD) for SEO
enableStructuredData = true
# Control robots meta tag for search engine indexing
enableRobotsNoIndex = false
# Path to favicon
favicon = "/favicon.png"
# Enable underline bar style (thin gray line) instead of default full-width bar
enableUnderlineBar = true
# Center align sidebar section headers (Skills, Education, Interests, etc.)
centerSidebarHeaders = true
# Control education section placement: true = sidebar only, false = main body only
educationSidebarOnly = true

