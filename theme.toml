# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "Enhanced CV Theme"
license = "MIT"
licenselink = "https://github.com/ineesalmeida/almeida-cv/master/LICENSE"
description = "Professional CV/Resume theme with advanced features including contact obfuscation, print optimization, and structured data support"
homepage = "https://github.com/ineesalmeida/almeida-cv"
tags = ["cv", "resume", "minimal", "secure", "print-optimized", "professional"]
features = [
  "contact-obfuscation",
  "print-mode",
  "structured-data",
  "responsive",
  "badge-system",
  "print-banner",
  "security-features",
  "dark-mode-support"
]
min_version = "0.100.0"

[author]
  name = "Inês Almeida"
  homepage = "ines-almeida.com"
